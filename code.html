<!-- code.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Генератор кода 2026</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .box { background: #2d3436; padding: 20px; display: inline-block; border-radius: 15px; }
        .big-code { font-size: 40px; color: gold; font-weight: bold; margin: 20px 0; }
        button { padding: 10px 20px; cursor: pointer; border-radius: 10px; border: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Создать матч</h2>
        <input type="text" id="nameInput" placeholder="Твоё имя" style="padding: 10px; border-radius: 5px;">
        <br><br>
        <button onclick="createGame()" style="background: gold;">ПОЛУЧИТЬ КОД</button>
        
        <div id="result" style="display:none;">
            <p>Твой секретный код:</p>
            <div id="displayCode" class="big-code">XXXX</div>
            <p>Отправь его Маше!</p>
            <!-- Кнопка перехода в саму игру -->
            <button onclick="goToGame()" style="background: #2ecc71; color: white;">ЗАЙТИ В ИГРУ</button>
        </div>
    </div>

    <script>
        function createGame() {
            const name = document.getElementById('nameInput').value;
            if(!name) return alert("Введи имя!");
            
            // Генерируем код
            const code = Math.random().toString(36).substring(2, 6).toUpperCase();
            
            // СОХРАНЯЕМ В ПАМЯТЬ БРАУЗЕРА (LocalStorage)
            localStorage.setItem('savedName', name);
            localStorage.setItem('savedCode', code);

            document.getElementById('displayCode').innerText = code;
            document.getElementById('result').style.display = 'block';
        }

        function goToGame() {
            // Переходим на страницу с онлайном
            window.location.href = 'online.html';
        }
    </script>
</body>
</html>
