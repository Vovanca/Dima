<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест связи</title>
</head>
<body style="background: #222; color: white; text-align: center; padding-top: 50px;">

    <h1>ПРОВЕРКА СВЯЗИ</h1>
    <p id="status">Нажми на кнопку ниже</p>
    
    <button id="testBtn" style="padding: 20px; font-size: 20px; background: gold; border-radius: 10px;">
        СОЗДАТЬ КОМНАТУ
    </button>

    <script type="module">
        // Импортируем только самое нужное
        import { initializeApp } from "https://www.gstatic.com";
        import { getDatabase, ref, set } from "https://www.gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyAAvBTIamQLMW2FvHBiA0LDr_TkW7YajVU",
            databaseURL: "https://football-3b1a1-default-rtdb.firebaseio.com",
            projectId: "football-3b1a1",
            appId: "1:13715190575:web:922b93c0039ca4941f67da"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);
            const btn = document.getElementById('testBtn');
            const status = document.getElementById('status');

            btn.onclick = function() {
                status.innerText = "Пытаюсь отправить данные...";
                
                // Пробуем записать тестовое значение
                set(ref(db, 'test_connect'), {
                    time: new Date().getTime(),
                    msg: "Работает!"
                }).then(() => {
                    alert("УРА! Связь с Firebase есть!");
                    status.innerText = "ВСЁ РАБОТАЕТ! Можешь ставить основной код.";
                }).catch((error) => {
                    alert("ОШИБКА БАЗЫ: " + error.message);
                    status.innerText = "Ошибка: " + error.message;
                });
            };
        } catch (e) {
            alert("Критическая ошибка скрипта: " + e.message);
        }
    </script>
</body>
</html>
