<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Football 2026 Fix</title>
    <script src="https://www.gstatic.com"></script>
    <script src="https://www.gstatic.com"></script>
    <style>
        body { margin: 0; background: #1a1a1a; font-family: sans-serif; color: white; text-align: center; }
        #menu { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 15px; }
        button { padding: 15px 30px; background: gold; border: none; border-radius: 50px; font-weight: bold; }
        #game { display: none; width: 100vw; height: 100vh; background: #2ecc71; position: relative; }
        .ball { position: absolute; width: 60px; height: 60px; background: white; border-radius: 50%; left: 50%; transform: translateX(-50%); border: 2px solid #000; }
        #status { color: #ff7675; font-size: 14px; padding: 10px; }
    </style>
</head>
<body>

<div id="menu">
    <h1>FOOTBALL 2026</h1>
    <div id="status">Нажми кнопку для проверки</div>
    <input type="text" id="nick" placeholder="Твой ник" style="padding:10px; border-radius:5px;">
    <button onclick="checkConnection()">ИГРАТЬ</button>
</div>

<div id="game" onpointerdown="kick()">
    <div id="score" style="font-size: 40px; padding: 20px;">0</div>
    <div id="ball" class="ball" style="top: 30%"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAAvBTIamQLMW2FvHBiA0LDr_TkW7YajVU",
        databaseURL: "https://football-3b1a1-default-rtdb.firebaseio.com",
        projectId: "football-3b1a1"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myId = "p" + Math.floor(Math.random() * 1000);
    let myY = 30, vy = 0, score = 0;

    function checkConnection() {
        const stat = document.getElementById('status');
        stat.innerText = "Связываюсь с сервером...";
        
        // Ставим ловушку на случай зависания
        const timeout = setTimeout(() => {
            stat.innerHTML = "Ошибка: Время ожидания вышло.<br>Проверь Rules в Firebase (должно быть true)!";
        }, 7000);

        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                clearTimeout(timeout);
                stat.innerText = "Есть контакт! Вхожу...";
                setTimeout(launch, 1000);
            }
        });
    }

    function launch() {
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game').style.display = 'block';
        
        setInterval(() => {
            vy += 0.5; myY += vy;
            if (myY > 90) { myY = 30; vy = 0; score = 0; }
            document.getElementById('ball').style.top = myY + "%";
            document.getElementById('score').innerText = score;
            // Синхронизация
            db.ref('rooms/777/' + myId).set({y: myY, s: score});
        }, 30);
    }

    window.kick = function() {
        vy = -12;
        score++;
    }
</script>
</body>
</html>
