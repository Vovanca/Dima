<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Football Online Battle 2026</title>
    <script type="module">
        // --- НАСТРОЙКА FIREBASE ---
        import { initializeApp } from "https://www.gstatic.com";
        import { getDatabase, ref, set, onValue, push, remove, onDisconnect, update } from "https://www.gstatic.com";

        const firebaseConfig = {
            apiKey: "ТВОЙ_API_KEY",
            authDomain: "ТВОЙ_PROJECT.firebaseapp.com",
            databaseURL: "https://ТВОЙ_PROJECT.firebaseio.com",
            projectId: "ТВОЙ_PROJECT",
            storageBucket: "ТВОЙ_PROJECT.appspot.com",
            messagingSenderId: "ID",
            appId: "APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
        let myId = Math.random().toString(36).substring(7);
        let myName = "";
        let currentRoom = null;
        let isAdmin = false;
        let players = {};

        // --- ЭЛЕМЕНТЫ ИНТЕРФЕЙСА ---
        const screens = {
            auth: document.getElementById('screen-auth'),
            lobby: document.getElementById('screen-lobby'),
            game: document.getElementById('screen-game')
        };

        window.createRoom = () => {
            myName = document.getElementById('nickname').value || "Игрок";
            currentRoom = Math.floor(1000 + Math.random() * 9000).toString();
            isAdmin = true;
            joinRoomLogic();
        };

        window.joinRoom = () => {
            myName = document.getElementById('nickname').value || "Игрок";
            currentRoom = document.getElementById('room-id').value;
            if(!currentRoom) return alert("Введите ID комнаты");
            isAdmin = false;
            joinRoomLogic();
        };

        function joinRoomLogic() {
            const playerRef = ref(db, `rooms/${currentRoom}/players/${myId}`);
            set(playerRef, { name: myName, isAdmin: isAdmin, x: 50, y: 30, score: 0 });
            onDisconnect(playerRef).remove();

            screens.auth.style.display = 'none';
            screens.lobby.style.display = 'flex';
            document.getElementById('display-room-id').textContent = currentRoom;

            // Следим за комнатой
            onValue(ref(db, `rooms/${currentRoom}`), (snapshot) => {
                const data = snapshot.val();
                if (!data) return;
                
                // Проверка на кик
                if (data.players && !data.players[myId]) {
                    location.reload(); 
                    alert("Вас исключили!");
                }

                players = data.players || {};
                renderLobby(players);

                if (data.status === "playing") {
                    startGameUI();
                }
            });
        }

        function renderLobby(playersList) {
            const list = document.getElementById('players-list');
            list.innerHTML = "";
            Object.keys(playersList).forEach(id => {
                const p = playersList[id];
                const li = document.createElement('div');
                li.className = 'player-item';
                li.innerHTML = `<span>${p.name} ${p.isAdmin ? '👑' : ''}</span>`;
                if (isAdmin && id !== myId) {
                    const btn = document.createElement('button');
                    btn.textContent = "КИК";
                    btn.onclick = () => remove(ref(db, `rooms/${currentRoom}/players/${id}`));
                    li.appendChild(btn);
                }
                list.appendChild(li);
            });
            document.getElementById('start-btn').style.display = isAdmin ? 'block' : 'none';
        }

        window.startSyncGame = () => {
            update(ref(db, `rooms/${currentRoom}`), { status: "playing" });
        };

        // --- ЛОГИКА ИГРЫ ---
        let ballPos = { x: 50, y: 30 };
        let vy = 0;
        
        function startGameUI() {
            screens.lobby.style.display = 'none';
            screens.game.style.display = 'block';
            gameLoop();
        }

        function gameLoop() {
            // Гравитация только для своего мяча
            vy += 0.5;
            ballPos.y += vy;
            if(ballPos.y > 90) { ballPos.y = 30; vy = 0; } // Сброс при падении

            // Отправка своих координат в сеть
            update(ref(db, `rooms/${currentRoom}/players/${myId}`), {
                y: ballPos.y
            });

            // Отрисовка всех игроков
            const field = document.getElementById('field');
            field.innerHTML = "";
            Object.keys(players).forEach(id => {
                const p = players[id];
                const b = document.createElement('div');
                b.className = 'ball';
                b.style.left = (id === myId ? 25 : 75) + "%"; // Разделение экрана
                b.style.top = p.y + "%";
                b.innerHTML = `<div class="ball-name">${p.name}</div>`;
                field.appendChild(b);
            });

            requestAnimationFrame(gameLoop);
        }

        window.kickBall = () => {
            vy = -12;
        };

        window.addEventListener('touchstart', (e) => {
            if(screens.game.style.display === 'block') kickBall();
        });
    </script>
    <style>
        body { margin: 0; font-family: sans-serif; background: #222; color: white; overflow: hidden; }
        .screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 15px; }
        input { padding: 10px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #field { width: 100vw; height: 100vh; background: #2ecc71; position: relative; }
        .ball { position: absolute; width: 60px; height: 60px; background: white; border-radius: 50%; transform: translate(-50%, -50%); border: 3px solid #333; }
        .ball-name { position: absolute; top: -20px; width: 100%; text-align: center; color: black; font-weight: bold; font-size: 12px; }
        .player-item { background: #333; padding: 10px; margin: 5px; width: 250px; display: flex; justify-content: space-between; border-radius: 5px; }
    </style>
</head>
<body>

    <!-- Экран входа -->
    <div id="screen-auth" class="screen">
        <h1>FOOTBALL ONLINE</h1>
        <input type="text" id="nickname" placeholder="Твой Ник">
        <hr style="width: 200px; opacity: 0.2;">
        <button onclick="createRoom()">СОЗДАТЬ КОМНАТУ</button>
        <div style="display:flex; gap:5px;">
            <input type="text" id="room-id" placeholder="ID Комнаты" style="width: 80px;">
            <button onclick="joinRoom()" style="background: #2980b9;">ВОЙТИ</button>
        </div>
    </div>

    <!-- Экран лобби -->
    <div id="screen-lobby" class="screen" style="display:none;">
        <h2>КОМНАТА: <span id="display-room-id"></span></h2>
        <div id="players-list"></div>
        <button id="start-btn" onclick="startSyncGame()" style="background: #f1c40f; color: black;">НАЧАТЬ ИГРУ</button>
    </div>

    <!-- Экран игры -->
    <div id="screen-game" style="display:none;">
        <div id="field"></div>
        <div style="position:fixed; bottom:10px; width:100%; text-align:center; opacity:0.5; font-size:10px;">
            Тапай, чтобы набивать мяч! Обновление 2026.
        </div>
    </div>

</body>
</html>
