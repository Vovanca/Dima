<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>20 Уровней — Football Duel 2026</title>
    <style>
        :root { --dima: #74b9ff; --masha: #ff7675; --gold: #fdcb6e; }
        * { box-sizing: border-box; touch-action: none; user-select: none; }
        body { margin: 0; padding: 0; overflow: hidden; background: #1e272e; font-family: 'Segoe UI', sans-serif; }

        /* Экран выбора уровней */
        #level-select {
            position: fixed; inset: 0; background: #1e272e;
            display: flex; flex-direction: column; align-items: center; z-index: 1000;
            padding: 20px; overflow-y: auto;
        }
        h1 { color: white; margin-bottom: 5px; }
        .hero-picker { display: flex; gap: 10px; margin-bottom: 15px; }
        .hero-btn {
            padding: 8px 16px; border-radius: 20px; border: 2px solid white;
            background: rgba(255,255,255,0.1); color: white; font-weight: bold; cursor: pointer;
        }
        .hero-btn.active { background: var(--gold); color: black; border-color: var(--gold); }

        .grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
            width: 100%; max-width: 360px; margin-bottom: 20px;
        }
        .lvl-btn {
            aspect-ratio: 1; border-radius: 14px; border: none;
            background: #2d3436; color: white; font-size: 18px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3); cursor: pointer;
        }
        .lvl-btn.active { background: var(--dima); color: white; }
        .lvl-btn.completed { background: #00b894; color: white; }
        .lvl-btn.locked { opacity: 0.4; pointer-events: none; }

        .btn-back {
            padding: 12px 30px; border-radius: 50px; border: none;
            background: #636e72; color: white; font-weight: bold; cursor: pointer;
        }

        /* Игровое поле */
        #game-area { position: relative; width: 100vw; height: 100vh; display: none; }
        .ball {
            position: absolute; width: 70px; height: 70px; background: white;
            background-image: radial-gradient(circle at 50% 50%, #333 22%, transparent 24%);
            background-size: 35px 35px; border-radius: 50%; box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            z-index: 10; will-change: transform;
        }
        .hud {
            position: absolute; top: 5%; width: 100%; text-align: center; color: white;
            pointer-events: none; z-index: 20;
        }
        .target-txt { font-size: 14px; color: var(--gold); }
        .score-txt { font-size: 48px; font-weight: bold; margin: 0; }

        #win-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 2000; color: white;
        }
    </style>
</head>
<body>

<div id="level-select">
    <h1>20 УРОВНЕЙ</h1>
    <div class="hero-picker">
        <button id="hero-dima" class="hero-btn active" onclick="setHero('ДИМА')">ИГРАТЬ ЗА ДИМУ</button>
        <button id="hero-masha" class="hero-btn" onclick="setHero('МАША')">ИГРАТЬ ЗА МАШУ</button>
    </div>

    <div class="grid" id="levels-grid"></div>

    <button class="btn-back" onclick="window.location.href='index.html'">В МЕНЮ</button>
</div>

<div id="win-modal">
    <h2 style="color: var(--gold); font-size: 28px;">УРОВЕНЬ ПРОЙДЕН! 🎉</h2>
    <p id="win-desc" style="margin-bottom: 20px;">Отличное чеканение!</p>
    <button class="btn-back" style="background: #00b894;" onclick="nextLevel()">СЛЕДУЮЩИЙ УРОВЕНЬ</button>
    <button class="btn-back" style="margin-top: 10px;" onclick="showMenu()">К УРОВНЯМ</button>
</div>

<div id="game-area">
    <div class="hud">
        <div id="player-label" style="font-weight: bold; font-size: 18px;">ДИМА</div>
        <div id="score" class="score-txt">0</div>
        <div id="target-label" class="target-txt">ЦЕЛЬ: 5</div>
    </div>
    <div id="ball" class="ball"></div>
</div>

<script>
    let currentHero = 'ДИМА';
    let currentLvl = 1;
    let score = 0;
    let targetScore = 5;
    let maxUnlocked = parseInt(localStorage.getItem('maxUnlockedLevel') || '1');

    const ball = document.getElementById('ball');
    const gameArea = document.getElementById('game-area');
    
    let bx = 0, by = 0, vx = 0, vy = 0, rot = 0;
    let gravity = 0.45;
    let isPlaying = false;

    function setHero(hero) {
        currentHero = hero;
        document.getElementById('hero-dima').classList.toggle('active', hero === 'ДИМА');
        document.getElementById('hero-masha').classList.toggle('active', hero === 'МАША');
        document.getElementById('player-label').textContent = hero;
        document.getElementById('player-label').style.color = (hero === 'ДИМА') ? 'var(--dima)' : 'var(--masha)';
    }

    function renderLevels() {
        const grid = document.getElementById('levels-grid');
        grid.innerHTML = '';
        for (let i = 1; i <= 20; i++) {
            const btn = document.createElement('button');
            btn.className = 'lvl-btn';
            btn.textContent = i;
            
            if (i < maxUnlocked) {
                btn.classList.add('completed');
            } else if (i === maxUnlocked) {
                btn.classList.add('active');
            } else {
                btn.classList.add('locked');
            }

            btn.onclick = () => startLevel(i);
            grid.appendChild(btn);
        }
    }

    function startLevel(lvl) {
        currentLvl = lvl;
        targetScore = lvl * 5; // Уровень 1 = 5 очков, Уровень 2 = 10 очков и т.д.
        score = 0;
        gravity = 0.45 + (lvl * 0.02); // Уровни становятся немного быстрее

        document.getElementById('score').textContent = score;
        document.getElementById('target-label').textContent = `ЦЕЛЬ: ${targetScore} (Уровень ${lvl})`;
        document.getElementById('level-select').style.display = 'none';
        gameArea.style.display = 'block';

        const r = gameArea.getBoundingClientRect();
        bx = r.width / 2 - 35;
        by = r.height / 3;
        vx = 0; vy = 0;
        isPlaying = true;
    }

    gameArea.addEventListener('pointerdown', (e) => {
        if (!isPlaying) return;
        const b = ball.getBoundingClientRect();
        const cx = b.left + 35;
        const cy = b.top + 35;

        if (Math.hypot(e.clientX - cx, e.clientY - cy) < 75) {
            vy = -14 - (currentLvl * 0.2);
            vx = (cx - e.clientX) * 0.6;
            score++;
            document.getElementById('score').textContent = score;

            if (navigator.vibrate) navigator.vibrate(20);

            if (score >= targetScore) {
                winLevel();
            }
        }
    });

    function winLevel() {
        isPlaying = false;
        if (currentLvl >= maxUnlocked && maxUnlocked < 20) {
            maxUnlocked = currentLvl + 1;
            localStorage.setItem('maxUnlockedLevel', maxUnlocked);
        }
        document.getElementById('win-desc').textContent = `${currentHero} набил(а) ${score} очков!`;
        document.getElementById('win-modal').style.display = 'flex';
    }

    function nextLevel() {
        document.getElementById('win-modal').style.display = 'none';
        startLevel(Math.min(20, currentLvl + 1));
    }

    function showMenu() {
        document.getElementById('win-modal').style.display = 'none';
        gameArea.style.display = 'none';
        document.getElementById('level-select').style.display = 'flex';
        renderLevels();
    }

    function update() {
        if (isPlaying) {
            vy += gravity;
            bx += vx; by += vy;
            vx *= 0.98;

            const r = gameArea.getBoundingClientRect();
            if (bx < 0) { bx = 0; vx *= -0.8; }
            if (bx + 70 > r.width) { bx = r.width - 70; vx *= -0.8; }
            
            if (by > r.height) {
                // Падение мяча — сброс очков уровня
                score = 0;
                document.getElementById('score').textContent = score;
                bx = r.width / 2 - 35;
                by = r.height / 3;
                vx = 0; vy = 0;
            }

            rot += vx * 2;
            ball.style.transform = `translate3d(${bx}px, ${by}px, 0) rotate(${rot}deg)`;
        }
        requestAnimationFrame(update);
    }

    renderLevels();
    update();
</script>
</body>
</html>
