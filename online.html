

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Football Online Battle</title>
    <script src="https://www.gstatic.com"></script>
    <script src="https://www.gstatic.com"></script>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; text-align: center; }
        #join-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #game { display: none; width: 100vw; height: 100vh; background: #2ecc71; position: relative; }
        .ball { position: absolute; width: 60px; height: 60px; background: white; border-radius: 50%; border: 3px solid #333; transform: translateX(-50%); transition: top 0.1s linear; }
        .ball-name { position: absolute; top: -25px; width: 100px; left: -20px; font-size: 12px; font-weight: bold; }
        input { padding: 12px; border-radius: 10px; border: none; margin: 10px; text-align: center; }
        button { padding: 15px 30px; background: gold; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="join-screen">
    <h2>ВХОД В ИГРУ</h2>
    <input type="text" id="playerName" placeholder="Ваше имя">
    <input type="text" id="gameCode" placeholder="Введите код игры">
    <button onclick="connect()">ВОЙТИ И ИГРАТЬ</button>
</div>

<div id="game">
    <div id="ui" style="padding: 20px; font-size: 24px;">Счёт: <span id="myScore">0</span></div>
    <div id="field"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAAvBTIamQLMW2FvHBiA0LDr_TkW7YajVU",
        databaseURL: "https://football-3b1a1-default-rtdb.firebaseio.com",
        projectId: "football-3b1a1"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myId = "p" + Math.floor(Math.random() * 999);
    let myName = "";
    let room = "";
    let myY = 30, vy = 0, score = 0;

    // Авто-вход для создателя
    window.onload = () => {
        const savedName = localStorage.getItem('tempName');
        const savedCode = localStorage.getItem('tempCode');
        if(savedName && savedCode) {
            document.getElementById('playerName').value = savedName;
            document.getElementById('gameCode').value = savedCode;
            localStorage.clear(); // Очищаем, чтобы не мешало
        }
    }

    function connect() {
        myName = document.getElementById('playerName').value;
        room = document.getElementById('gameCode').value.toUpperCase();
        if(!myName || !room) return alert("Заполните все поля!");

        document.getElementById('join-screen').style.display = 'none';
        document.getElementById('game').style.display = 'block';

        const playerRef = db.ref('matches/' + room + '/' + myId);
        playerRef.set({ name: myName, y: 30, s: 0 });
        playerRef.onDisconnect().remove();

        // Физика
        setInterval(() => {
            vy += 0.5; myY += vy;
            if(myY > 90) { myY = 30; vy = 0; score = 0; }
            if(myY < 0) { myY = 0; vy = 0; }
            playerRef.update({ y: myY, s: score });
            document.getElementById('myScore').innerText = score;
        }, 30);

        // Отрисовка всех
        db.ref('matches/' + room).on('value', (snap) => {
            const data = snap.val();
            const field = document.getElementById('field');
            field.innerHTML = "";
            for(let id in data) {
                const b = document.createElement('div');
                b.className = 'ball';
                b.style.top = data[id].y + "%";
                b.style.left = (id === myId) ? "30%" : "70%";
                b.innerHTML = `<div class="ball-name">${data[id].name} [${data[id].s}]</div>`;
                if(id === myId) b.style.borderColor = "gold";
                field.appendChild(b);
            }
        });
    }

    window.onpointerdown = () => { vy = -12; score++; };
</script>
</body>
</html>
