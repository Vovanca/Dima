<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Football Duo 2026</title>
    <style>
        :root { --gold: #f1c40f; --grass: #2ecc71; --masha: #ff6b6b; --dima: #4dabf7; }
        body { margin: 0; padding: 0; overflow: hidden; background: #222; font-family: 'Segoe UI', sans-serif; touch-action: none; user-select: none; }
        
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        
        /* Зоны игроков */
        .player-zone { position: relative; flex: 1; width: 100%; overflow: hidden; transition: 0.5s; border: 2px solid rgba(0,0,0,0.2); }
        #zone-masha { background: linear-gradient(to bottom, #2d3436, var(--masha)); }
        #zone-dima { background: linear-gradient(to top, #2d3436, var(--dima)); }

        /* Мячи */
        .ball { 
            position: absolute; width: 70px; height: 70px; background: white;
            background-image: radial-gradient(circle at 50% 50%, #222 22%, transparent 24%), radial-gradient(circle at 0% 0%, #222 22%, transparent 24%);
            background-size: 35px 35px; border-radius: 50%; box-shadow: 0 10px 20px rgba(0,0,0,0.3); z-index: 10; 
        }

        /* Тексты */
        .info { position: absolute; width: 100%; text-align: center; color: white; pointer-events: none; z-index: 20; }
        .score { font-size: 40px; font-weight: 900; margin: 5px 0; }
        .name { font-size: 18px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8; }

        /* Кнопка режима */
        #mode-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 100; padding: 10px 20px; background: white; border-radius: 30px;
            font-weight: bold; cursor: pointer; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        #dima-footer {
            position: absolute; bottom: 10px; width: 100%; text-align: center;
            color: white; font-size: 11px; opacity: 0.6; z-index: 100; pointer-events: none;
        }

        .ach { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: gold; color: black; padding: 5px 15px; border-radius: 20px; font-weight: bold; display: none; z-index: 200; }
    </style>
</head>
<body>

<button id="mode-btn" onclick="toggleMode()">РЕЖИМ: 1 ИГРОК</button>

<div id="game-container">
    <!-- ЗОНА МАШИ -->
    <div id="zone-masha" class="player-zone">
        <div class="info" style="top: 20px;">
            <div class="name">Маша</div>
            <div id="score-masha" class="score">0</div>
        </div>
        <div id="ball-masha" class="ball"></div>
    </div>

    <!-- ЗОНА ДИМЫ -->
    <div id="zone-dima" class="player-zone">
        <div id="ball-dima" class="ball"></div>
        <div class="info" style="bottom: 40px;">
            <div id="score-dima" class="score">0</div>
            <div class="name">Дима</div>
        </div>
    </div>
</div>

<div id="dima-footer">
    Привет Дима, игра обновлена (2026). <br> 
    В режиме 2-х игроков рекорды не сохраняются. При обновлении рекорд может сброситься.
</div>

<script>
    const config = { gravity: 0.4, friction: 0.98, kickStr: -14 };
    let isTwoPlayer = false;

    class Player {
        constructor(id, zoneId, ballId, scoreId) {
            this.id = id;
            this.zone = document.getElementById(zoneId);
            this.ball = document.getElementById(ballId);
            this.scoreEl = document.getElementById(scoreId);
            this.score = 0;
            this.x = 100; this.y = 100; this.vx = 0; this.vy = 0;
            this.rot = 0;
            this.active = true;
        }

        reset() {
            const rect = this.zone.getBoundingClientRect();
            this.x = rect.width / 2 - 35;
            this.y = rect.height / 3;
            this.vx = 0; this.vy = 0;
            this.score = 0;
            this.scoreEl.textContent = 0;
        }

        update() {
            if (!this.active) return;
            this.vy += config.gravity;
            this.x += this.vx;
            this.y += this.vy;
            this.vx *= config.friction;

            const rect = this.zone.getBoundingClientRect();

            // Стены
            if (this.x < 0) { this.x = 0; this.vx *= -0.8; }
            if (this.x + 70 > rect.width) { this.x = rect.width - 70; this.vx *= -0.8; }
            if (this.y < 0) { this.y = 0; this.vy *= -0.5; }

            // Падение
            if (this.y > rect.height) {
                this.reset();
            }

            this.rot += this.vx * 2;
            this.ball.style.transform = `translate(${this.x}px, ${this.y}px) rotate(${this.rot}deg)`;
        }

        kick(cx, cy) {
            const b = this.ball.getBoundingClientRect();
            const bx = b.left + 35;
            const by = b.top + 35;
            const dist = Math.hypot(cx - bx, cy - by);

            if (dist < 60) {
                this.score++;
                this.scoreEl.textContent = this.score;
                this.vy = config.kickStr;
                this.vx = (bx - cx) * 0.6;
            }
        }
    }

    const masha = new Player('masha', 'zone-masha', 'ball-masha', 'score-masha');
    const dima = new Player('dima', 'zone-dima', 'ball-dima', 'score-dima');

    function toggleMode() {
        isTwoPlayer = !isTwoPlayer;
        document.getElementById('mode-btn').textContent = isTwoPlayer ? "РЕЖИМ: 2 ИГРОКА" : "РЕЖИМ: 1 ИГРОК";
        document.getElementById('zone-masha').style.display = isTwoPlayer ? "block" : "none";
        masha.active = isTwoPlayer;
        masha.reset();
        dima.reset();
    }

    function handleInput(e) {
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        
        const mid = window.innerHeight / 2;
        if (isTwoPlayer) {
            if (cy < mid) masha.kick(cx, cy);
            else dima.kick(cx, cy);
        } else {
            dima.kick(cx, cy);
        }
    }

    function loop() {
        masha.update();
        dima.update();
        requestAnimationFrame(loop);
    }

    window.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(e); }, {passive:false});
    window.addEventListener('mousedown', handleInput);

    // Начальное состояние
    document.getElementById('zone-masha').style.display = "none";
    masha.active = false;
    
    dima.reset();
    loop();
</script>
</body>
</html>
