<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Football Pusher Game</title>
    <!-- Библиотека Pusher актуальная на 2026 год -->
    <script src="https://js.pusher.com"></script>
    <style>
        body { margin: 0; background: #1a1a1a; font-family: sans-serif; color: white; text-align: center; touch-action: none; overflow: hidden; }
        #menu { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 15px; }
        input { padding: 12px; border-radius: 10px; border: 2px solid #3498db; width: 220px; background: #2d3436; color: white; text-align: center; }
        button { padding: 15px 30px; border-radius: 50px; border: none; background: #3498db; color: white; font-weight: bold; cursor: pointer; width: 240px; }
        #game { display: none; width: 100vw; height: 100vh; background: #27ae60; position: relative; }
        .ball { position: absolute; width: 60px; height: 60px; background: white; border-radius: 50%; border: 3px solid #333; transform: translateX(-50%); transition: top 0.05s linear; }
        .ball-name { position: absolute; top: -25px; width: 150px; left: -45px; text-align: center; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div id="menu">
    <h2>FOOTBALL ONLINE</h2>
    <div id="status" style="font-size: 12px; color: #3498db;">Готов к подключению</div>
    <input type="text" id="nickInput" placeholder="Твой ник">
    <input type="text" id="roomInput" placeholder="Код комнаты (напр. 777)">
    <button onclick="enterGame()">ИГРАТЬ</button>
</div>

<div id="game">
    <div id="field"></div>
</div>

<script>
    // ТВОИ ДАННЫЕ ИЗ СКРИНШОТА
    const PUSHER_KEY = '189157bc79f7fa997ad7'; 
    const PUSHER_CLUSTER = 'mt1';

    let pusher, channel;
    let myId = "p" + Math.floor(Math.random() * 9999);
    let myY = 30, vy = 0, myName = "", roomID = "";

    function enterGame() {
        myName = document.getElementById('nickInput').value.trim();
        roomID = document.getElementById('roomInput').value.trim().toLowerCase();
        if (!myName || !roomID) return alert("Введи ник и комнату!");

        // Инициализация
        pusher = new Pusher(PUSHER_KEY, { cluster: PUSHER_CLUSTER, forceTLS: true });
        
        // ВАЖНО: Используем 'cache-' префикс для работы без сервера в 2026 году
        channel = pusher.subscribe('cache-room-' + roomID);

        // Слушаем движения других
        channel.bind('client-move', (data) => {
            if (data.id !== myId) updateBall(data.id, data.name, data.y);
        });

        document.getElementById('menu').style.display = 'none';
        document.getElementById('game').style.display = 'block';

        // Физика и отправка данных
        setInterval(() => {
            vy += 0.5; myY += vy;
            if (myY > 90) { myY = 30; vy = 0; }
            updateBall(myId, myName, myY);
            
            // Сообщаем другим, где наш мяч
            channel.trigger('client-move', { id: myId, name: myName, y: myY });
        }, 50);
    }

    function updateBall(id, name, y) {
        let ball = document.getElementById('ball-' + id);
        if (!ball) {
            ball = document.createElement('div');
            ball.id = 'ball-' + id;
            ball.className = 'ball';
            ball.innerHTML = `<div class="ball-name"></div>`;
            document.getElementById('field').appendChild(ball);
        }
        ball.style.left = (id === myId) ? "30%" : "70%";
        ball.style.top = y + "%";
        ball.querySelector('.ball-name').innerText = name;
        if (id === myId) ball.style.borderColor = "gold";
    }

    // Прыжок
    window.onpointerdown = () => { if(document.getElementById('game').style.display === 'block') vy = -12; };
</script>
</body>
</html>
