<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Football Levels Pro 2026</title>
    <style>
        :root { --gold: #f1c40f; --dark: #1e272e; }
        body { margin: 0; padding: 0; overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', sans-serif; touch-action: none; user-select: none; }
        
        /* Главное меню выбора уровней */
        #level-menu { position: fixed; inset: 0; background: var(--dark); z-index: 1000; display: flex; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; }
        .level-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 20px; }
        .level-card { width: 60px; height: 60px; background: #34495e; display: flex; align-items: center; justify-content: center; border-radius: 12px; cursor: pointer; font-weight: bold; color: white; border: 2px solid transparent; }
        .level-card.unlocked { background: #27ae60; }
        .level-card.locked { opacity: 0.3; cursor: not-allowed; }
        .level-card.current { border-color: var(--gold); box-shadow: 0 0 15px var(--gold); }

        /* Пауза */
        #pause-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 500; display: none; flex-direction: column; align-items: center; justify-content: center; }
        
        /* Игра */
        #game-container { position: relative; width: 100vw; height: 100vh; background: #2ecc71; display: none; }
        .wall { position: absolute; top: 0; bottom: 0; background: #2c3e50; width: 0; transition: 0.5s; z-index: 5; }
        #ball { position: absolute; width: 60px; height: 60px; background: white; border-radius: 50%; border: 3px solid #333; z-index: 10; background-image: radial-gradient(circle at 30% 30%, #fff, #ccc); }
        
        .btn { padding: 12px 25px; background: var(--gold); border: none; border-radius: 30px; font-weight: bold; cursor: pointer; margin: 10px; font-size: 16px; }
        #pause-btn { position: absolute; top: 20px; right: 20px; z-index: 100; background: rgba(0,0,0,0.3); color: white; border-radius: 50%; width: 45px; height: 45px; border: 2px solid white; font-size: 20px; }
        
        #ui { position: absolute; top: 20px; left: 20px; color: white; pointer-events: none; z-index: 100; }
    </style>
</head>
<body>

<!-- МЕНЮ ВЫБОРА УРОВНЕЙ -->
<div id="level-menu">
    <h1 style="color: var(--gold);">УРОВНИ (2026)</h1>
    <div style="color: #aaa; margin-bottom: 10px;">Пройдено: <span id="stats-done">0</span> / 20</div>
    <div class="level-grid" id="grid"></div>
    <button class="btn" style="margin-top: 30px;" onclick="location.href='index.html'">В МЕНЮ ИГРЫ</button>
</div>

<!-- ЭКРАН ПАУЗЫ -->
<div id="pause-screen">
    <h2 style="color: white;">ПАУЗА</h2>
    <button class="btn" onclick="togglePause(false)">ПРОДОЛЖИТЬ</button>
    <button class="btn" style="background: #e74c3c; color: white;" onclick="exitToMenu()">ВЫЙТИ ИЗ УРОВНЯ</button>
</div>

<!-- ИГРОВОЙ ПРОЦЕСС -->
<div id="game-container">
    <button id="pause-btn" onclick="togglePause(true)">II</button>
    <div id="ui">
        <div style="font-size: 14px;">УРОВЕНЬ <span id="cur-lvl-txt">1</span></div>
        <div style="font-size: 32px; font-weight: 900;" id="score-txt">0</div>
        <div style="font-size: 12px;">ЦЕЛЬ: <span id="target-txt">5</span></div>
    </div>
    <div id="wall-left" class="wall"></div>
    <div id="wall-right" class="wall"></div>
    <div id="ball"></div>
</div>

<script>
    const TOTAL_LEVELS = 20;
    let unlockedLevels = parseInt(localStorage.getItem('fb_unlocked')) || 1;
    let currentLvl = 1;
    let score = 0;
    let isPaused = false;
    let gameActive = false;

    // Параметры физики
    let x, y, vx, vy, config = {};

    function initMenu() {
        const grid = document.getElementById('grid');
        grid.innerHTML = "";
        document.getElementById('stats-done').textContent = unlockedLevels - 1;

        for (let i = 1; i <= TOTAL_LEVELS; i++) {
            const card = document.createElement('div');
            card.className = `level-card ${i <= unlockedLevels ? 'unlocked' : 'locked'} ${i === unlockedLevels ? 'current' : ''}`;
            card.textContent = i;
            if (i <= unlockedLevels) {
                card.onclick = () => startLevel(i);
            }
            grid.appendChild(card);
        }
    }

    function startLevel(lvl) {
        currentLvl = lvl;
        gameActive = true;
        isPaused = false;
        score = 0;
        
        // Сложность растет плавно
        config = {
            target: 5 + (lvl - 1) * 3,
            grav: 0.4 + (lvl - 1) * 0.04,
            walls: Math.min((lvl - 1) * 12, window.innerWidth * 0.35)
        };

        document.getElementById('level-menu').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        document.getElementById('cur-lvl-txt').textContent = lvl;
        document.getElementById('target-txt').textContent = config.target;
        document.getElementById('score-txt').textContent = "0";
        
        document.getElementById('wall-left').style.width = config.walls + 'px';
        document.getElementById('wall-right').style.width = config.walls + 'px';
        
        resetBall();
        update();
    }

    function resetBall() {
        x = window.innerWidth / 2 - 30;
        y = window.innerHeight / 3;
        vx = 0; vy = 0;
    }

    function togglePause(val) {
        isPaused = val;
        document.getElementById('pause-screen').style.display = val ? 'flex' : 'none';
    }

    function exitToMenu() {
        gameActive = false;
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('pause-screen').style.display = 'none';
        document.getElementById('level-menu').style.display = 'flex';
        initMenu();
    }

    function update() {
        if (!gameActive || isPaused) return;

        vy += config.grav;
        x += vx; y += vy;

        let leftBound = config.walls;
        let rightBound = window.innerWidth - config.walls - 60;

        if (x < leftBound) { x = leftBound; vx *= -0.7; }
        if (x > rightBound) { x = rightBound; vx *= -0.7; }
        if (y < 0) { y = 0; vy *= -0.4; }

        if (y > window.innerHeight) {
            score = 0;
            document.getElementById('score-txt').textContent = "0";
            resetBall();
        }

        document.getElementById('ball').style.transform = `translate(${x}px, ${y}px)`;
        requestAnimationFrame(update);
    }

    window.onpointerdown = (e) => {
        if (!gameActive || isPaused || e.target.id === 'pause-btn') return;
        
        const rect = document.getElementById('ball').getBoundingClientRect();
        const bx = rect.left + 30;
        const by = rect.top + 30;
        
        if (Math.hypot(e.clientX - bx, e.clientY - by) < 60) {
            score++;
            document.getElementById('score-txt').textContent = score;
            vy = -13;
            vx = (bx - e.clientX) * 0.6;

            if (score >= config.target) {
                if (currentLvl === unlockedLevels && unlockedLevels < TOTAL_LEVELS) {
                    unlockedLevels++;
                    localStorage.setItem('fb_unlocked', unlockedLevels);
                }
                alert("УРОВЕНЬ ПРОЙДЕН!");
                exitToMenu();
            }
        }
    };

    initMenu();
</script>
</body>
</html>
