<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Онлайн Код — Football Duel 2026</title>
    <style>
        :root { --dima: #74b9ff; --masha: #ff7675; --gold: #fdcb6e; }
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            margin: 0; padding: 20px; min-height: 100vh;
            background: #1e272e; font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white;
        }
        .card {
            background: #2d3436; padding: 25px; border-radius: 20px;
            width: 100%; max-width: 360px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
        }
        h2 { margin-top: 0; color: var(--gold); letter-spacing: 1px; }
        .input-group { margin: 15px 0; text-align: left; }
        label { display: block; font-size: 12px; margin-bottom: 5px; opacity: 0.8; }
        input {
            width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #636e72;
            background: #0f1416; color: white; font-size: 16px; outline: none; text-align: center;
        }
        input:focus { border-color: var(--dima); }
        .code-display {
            font-size: 32px; font-weight: bold; letter-spacing: 5px; color: var(--gold);
            background: #0f1416; padding: 15px; border-radius: 12px; margin: 15px 0;
            border: 2px dashed var(--gold); word-break: break-all;
        }
        .btn {
            width: 100%; padding: 14px; margin-top: 10px; border: none; border-radius: 50px;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-main { background: var(--dima); color: white; }
        .btn-copy { background: #00b894; color: white; }
        .btn-back { background: #636e72; color: white; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>ОНЛАЙН ДУЭЛЬ</h2>
    <p style="font-size: 13px; opacity: 0.7; margin-bottom: 20px;">Введите имя и создайте room-код для игры с другом!</p>

    <div class="input-group">
        <label for="playerName">ВАШЕ ИМЯ:</label>
        <input type="text" id="playerName" placeholder="Например: Дима или Маша" maxlength="12">
    </div>

    <button class="btn btn-main" onclick="generateCode()">СГЕНЕРИРОВАТЬ КОД</button>

    <div id="codeSection" style="display: none;">
        <div class="code-display" id="generatedCode">------</div>
        <button class="btn btn-copy" onclick="copyCode()">СКОПИРОВАТЬ КОД</button>
    </div>

    <button class="btn btn-back" onclick="saveAndGoBack()">СОХРАНИТЬ И В МЕНЮ</button>
</div>

<script>
    const nameInput = document.getElementById('playerName');
    const savedName = localStorage.getItem('savedName');
    
    if (savedName) {
        nameInput.value = savedName;
    } else {
        nameInput.value = 'Дима';
    }

    function generateCode() {
        const name = nameInput.value.trim() || 'Игрок';
        localStorage.setItem('savedName', name);

        const randomCode = 'MATCH-' + Math.floor(1000 + Math.random() * 9000);
        document.getElementById('generatedCode').textContent = randomCode;
        document.getElementById('codeSection').style.display = 'block';
    }

    function copyCode() {
        const code = document.getElementById('generatedCode').textContent;
        navigator.clipboard.writeText(code).then(() => {
            alert('Код ' + code + ' скопирован в буфер обмена!');
        }).catch(() => {
            alert('Скопировано: ' + code);
        });
    }

    function saveAndGoBack() {
        const name = nameInput.value.trim() || 'Дима';
        localStorage.setItem('savedName', name);
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
