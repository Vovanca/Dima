<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Football Pro Rooms 2026</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com";
        import { getDatabase, ref, set, onValue, update, onDisconnect } from "https://www.gstatic.com";

        // ТВОИ КЛЮЧИ (ПРОВЕРЬ ИХ ЕЩЕ РАЗ)
        const firebaseConfig = {
            apiKey: "AIzaSyAAvBTIamQLMW2FvHBiA0LDr_TkW7YajVU",
            authDomain: "football-3b1a1.firebaseapp.com",
            databaseURL: "https://football-3b1a1-default-rtdb.firebaseio.com",
            projectId: "football-3b1a1",
            storageBucket: "football-3b1a1.firebasestorage.app",
            messagingSenderId: "13715190575",
            appId: "1:13715190575:web:922b93c0039ca4941f67da"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let myId = Math.random().toString(36).substring(7);
        let myName = "", roomID = "", isAdmin = false, isPaused = false;
        let players = {}, targetScore = 10;

        window.joinRoom = async (asAdmin) => {
            myName = document.getElementById('nickInput').value.trim() || "Игрок";
            roomID = document.getElementById('roomInput').value.trim() || "123";
            targetScore = parseInt(document.getElementById('targetInput').value) || 10;
            isAdmin = asAdmin;

            try {
                const myRef = ref(db, `rooms/${roomID}/players/${myId}`);
                
                if (isAdmin) {
                    // Создаем комнату
                    await update(ref(db, `rooms/${roomID}`), { 
                        hostId: myId, 
                        target: targetScore, 
                        paused: false 
                    });
                }

                // Добавляем себя
                await set(myRef, { name: myName, y: 30, score: 0 });
                onDisconnect(myRef).remove();

                // Если дошли сюда — база работает!
                document.getElementById('menu').style.display = 'none';
                document.getElementById('game').style.visibility = 'visible';
                if (isAdmin) document.getElementById('admin-panel').style.display = 'block';

                // Слушаем обновления
                onValue(ref(db, `rooms/${roomID}`), (snapshot) => {
                    const data = snapshot.val();
                    if (!data) return;
                    players = data.players || {};
                    targetScore = data.target || 10;
                    isPaused = data.paused || false;
                    document.getElementById('pause-screen').style.display = isPaused ? 'flex' : 'none';
                    render();
                });

                startPhysics();

            } catch (error) {
                console.error(error);
                alert("Ошибка подключения! Проверь Rules в Firebase. Текст ошибки: " + error.message);
            }
        };

        window.togglePause = () => {
            if (!isAdmin) return;
            update(ref(db, `rooms/${roomID}`), { paused: !isPaused });
        };

        let vy = 0, myY = 30, myScore = 0;
        function startPhysics() {
            setInterval(() => {
                if (isPaused) return;
                vy += 0.45; myY += vy;
                if (myY > 90) { myY = 30; vy = 0; myScore = 0; sync(); }
                if (myY < 0) { myY = 0; vy = 0; }
                const b = document.getElementById('my-ball');
                if (b) b.style.top = myY + "%";
            }, 30);
        }

        function sync() {
            update(ref(db, `rooms/${roomID}/players/${myId}`), { y: myY, score: myScore });
        }

        window.kick = () => {
            if (isPaused || document.getElementById('game').style.visibility !== 'visible') return;
            vy = -13; myScore++;
            sync();
            if (myScore >= targetScore) {
                alert("ВЫ ПОБЕДИЛИ!");
                location.reload();
            }
        };

        function render() {
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = "";
            const field = document.getElementById('game-field');
            document.querySelectorAll('.remote-ball').forEach(el => el.remove());

            const sorted = Object.values(players).sort((a,b) => b.score - a.score);
            sorted.forEach(p => {
                list.innerHTML += `<div>${p.name}: ${p.score}</div>`;
            });

            Object.keys(players).forEach(id => {
                if (id !== myId) {
                    let rb = document.createElement('div');
                    rb.className = 'ball remote-ball';
                    rb.style.top = players[id].y + "%";
                    rb.innerHTML = `<div class="name-tag">${players[id].name}</div>`;
                    field.appendChild(rb);
                }
            });
        }

        window.addEventListener('pointerdown', (e) => {
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') kick();
        });
    </script>
    <style>
        body { margin: 0; background: #1a1a1a; font-family: sans-serif; color: white; overflow: hidden; touch-action: none; }
        #menu { position: fixed; inset: 0; z-index: 100; background: #1e272e; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
        #game { position: relative; width: 100vw; height: 100vh; visibility: hidden; background: #2ecc71; border: 5px solid #27ae60; box-sizing: border-box; }
        .ball { position: absolute; left: 50%; width: 60px; height: 60px; background: white; border-radius: 50%; transform: translateX(-50%); border: 3px solid #333; transition: top 0.1s linear; }
        #my-ball { border-color: gold; z-index: 10; box-shadow: 0 0 15px gold; }
        .name-tag { position: absolute; top: -20px; width: 100px; left: -20px; text-align: center; font-size: 11px; color: white; text-shadow: 1px 1px 1px black; }
        #admin-panel { position: absolute; bottom: 20px; left: 20px; display: none; z-index: 200; }
        #leaderboard { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 10px; min-width: 120px; }
        #pause-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 500; font-size: 50px; color: gold; }
        input { padding: 12px; border-radius: 8px; border: none; width: 220px; text-align: center; font-size: 16px; }
        button { padding: 15px 30px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        .btn-create { background: #f1c40f; color: black; }
        .btn-join { background: #3498db; color: white; }
    </style>
</head>
<body>

<div id="menu">
    <h1 style="color: gold; margin-bottom: 20px;">FOOTBALL 2026 ONLINE</h1>
    <input type="text" id="nickInput" placeholder="Твой Ник">
    <input type="text" id="roomInput" placeholder="Код комнаты (напр. 777)">
    <input type="number" id="targetInput" value="10" placeholder="Цель баллов">
    <button class="btn-create" onclick="joinRoom(true)">СОЗДАТЬ КОМНАТУ</button>
    <button class="btn-join" onclick="joinRoom(false)">ВОЙТИ ПО КОДУ</button>
</div>

<div id="pause-screen">ПАУЗА</div>

<div id="game">
    <div id="leaderboard">
        <div style="font-size: 12px; border-bottom: 1px solid gold; margin-bottom: 8px; color: gold;">ЛИДЕРЫ РУМА</div>
        <div id="leaderboard-list"></div>
    </div>
    <div id="admin-panel">
        <button onclick="togglePause()" style="background: #e67e22; color: white; border: 2px solid white;">ПАУЗА / СТАРТ</button>
    </div>
    <div id="game-field">
        <div id="my-ball" class="ball" style="top: 30%;">
            <div class="name-tag">ВЫ</div>
        </div>
    </div>
</div>

</body>
</html>
