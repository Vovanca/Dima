<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Football 2026: Battle</title>
    <style>
        :root { --masha: #ff7675; --dima: #74b9ff; --gold: #fdcb6e; }
        body { margin: 0; padding: 0; overflow: hidden; background: #1e272e; font-family: 'Segoe UI', sans-serif; touch-action: none; user-select: none; }
        
        /* Меню */
        #menu {
            position: fixed; inset: 0; background: #1e272e;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000;
        }
        .menu-btn {
            padding: 15px 30px; margin: 10px; font-size: 18px; font-weight: bold;
            border: none; border-radius: 50px; cursor: pointer; width: 280px;
            background: var(--gold); color: black; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        #btn-single { background: var(--dima); color: white; }

        /* Выбор баллов */
        .score-selector { margin-bottom: 20px; text-align: center; color: white; }
        select { padding: 10px; border-radius: 10px; font-size: 16px; background: #34495e; color: white; border: 2px solid var(--gold); outline: none; }

        /* Поле */
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; visibility: hidden; }
        .zone { position: relative; flex: 1; height: 100%; }
        #zone-masha { background: linear-gradient(180deg, #2d3436, var(--masha)); display: none; border-right: 2px solid rgba(0,0,0,0.3); }
        #zone-dima { background: linear-gradient(180deg, #2d3436, var(--dima)); }

        .ball { 
            position: absolute; width: 75px; height: 75px; background: white;
            background-image: radial-gradient(circle at 50% 50%, #333 22%, transparent 24%), radial-gradient(circle at 0% 0%, #333 22%, transparent 24%);
            background-size: 40px 40px; border-radius: 50%; box-shadow: 0 10px 20px rgba(0,0,0,0.4); z-index: 10; 
        }

        .info { position: absolute; top: 10%; width: 100%; text-align: center; color: white; pointer-events: none; z-index: 20; }
        .score { font-size: 60px; font-weight: 900; margin: 0; }
        .target-info { font-size: 14px; opacity: 0.7; }

        /* Экран победы */
        #win-screen {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; color: white;
        }
    </style>
</head>
<body>

<div id="menu">
    <h1 style="color: white; margin-bottom: 20px; letter-spacing: 3px;">FOOTBALL 2026</h1>
    
    <div class="score-selector">
        <label>Играем до: </label>
        <select id="targetScore">
            <option value="10">10 баллов</option>
            <option value="25">25 баллов</option>
            <option value="50">50 баллов</option>
            <option value="100">100 баллов</option>
            <option value="9999">Без лимита</option>
        </select>
    </div>

    <button class="menu-btn" id="btn-single" onpointerdown="startMode(1)">ИГРАТЬ (ДИМА)</button>
    <button class="menu-btn" onpointerdown="startMode(2)">МАША VS ДИМА</button>
</div>

<div id="win-screen">
    <h1 id="winner-name" style="font-size: 40px; color: var(--gold);">ПОБЕДА!</h1>
    <button class="menu-btn" onpointerdown="location.reload()">В МЕНЮ</button>
</div>

<div id="game-container">
    <div id="zone-masha" class="zone">
        <div class="info">
            <div style="font-size:20px">МАША</div>
            <div id="score-masha" class="score">0</div>
            <div class="target-info">Цель: <span class="goal-val">10</span></div>
        </div>
        <div id="ball-masha" class="ball"></div>
    </div>
    <div id="zone-dima" class="zone">
        <div class="info">
            <div style="font-size:20px">ДИМА</div>
            <div id="score-dima" class="score">0</div>
            <div class="target-info">Цель: <span class="goal-val">10</span></div>
        </div>
        <div id="ball-dima" class="ball"></div>
    </div>
</div>

<script>
    const config = { grav: 0.45, fric: 0.98, kick: -15 };
    let isTwo = false;
    let target = 10;
    let gameEnded = false;

    class Player {
        constructor(zoneId, ballId, scoreId, name) {
            this.zone = document.getElementById(zoneId);
            this.ball = document.getElementById(ballId);
            this.scoreEl = document.getElementById(scoreId);
            this.name = name;
            this.score = 0; this.x = 0; this.y = 0; this.vx = 0; this.vy = 0; this.rot = 0;
            this.active = false;
        }
        reset() {
            const r = this.zone.getBoundingClientRect();
            this.x = r.width / 2 - 37;
            this.y = r.height / 3;
            this.vx = 0; this.vy = 0; this.score = 0;
            this.scoreEl.textContent = 0;
        }
        update() {
            if (!this.active || gameEnded) return;
            this.vy += config.grav;
            this.x += this.vx; this.y += this.vy;
            this.vx *= config.fric;
            const r = this.zone.getBoundingClientRect();

            if (this.x < 0) { this.x = 0; this.vx *= -0.8; }
            if (this.x + 75 > r.width) { this.x = r.width - 75; this.vx *= -0.8; }
            if (this.y < 0) { this.y = 0; this.vy *= -0.5; }
            if (this.y > r.height) { this.score = 0; this.scoreEl.textContent = 0; this.y = r.height / 3; this.vy = 0; }

            this.rot += this.vx * 2;
            this.ball.style.transform = `translate(${this.x}px, ${this.y}px) rotate(${this.rot}deg)`;
        }
        hit(cx, cy) {
            if (gameEnded) return;
            const b = this.ball.getBoundingClientRect();
            const bx = b.left + 37; const by = b.top + 37;
            if (Math.hypot(cx - bx, cy - by) < 75) {
                this.score++;
                this.scoreEl.textContent = this.score;
                this.vy = config.kick;
                this.vx = (bx - cx) * 0.7;
                if (this.score >= target) win(this.name);
            }
        }
    }

    const masha = new Player('zone-masha', 'ball-masha', 'score-masha', 'МАША');
    const dima = new Player('zone-dima', 'ball-dima', 'score-dima', 'ДИМА');

    function startMode(mode) {
        target = parseInt(document.getElementById('targetScore').value);
        document.querySelectorAll('.goal-val').forEach(el => el.textContent = target === 9999 ? "∞" : target);
        
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game-container').style.visibility = 'visible';
        isTwo = (mode === 2);
        
        if (isTwo) {
            document.getElementById('zone-masha').style.display = 'block';
            masha.active = true; masha.reset();
        }
        dima.active = true; dima.reset();
        gameLoop();
    }

    function win(name) {
        gameEnded = true;
        const screen = document.getElementById('win-screen');
        const text = document.getElementById('winner-name');
        text.textContent = "ПОБЕДИЛ(А) " + name + "!";
        screen.style.display = 'flex';
    }

    function gameLoop() {
        masha.update();
        dima.update();
        requestAnimationFrame(gameLoop);
    }

    window.addEventListener('pointerdown', (e) => {
        const cx = e.clientX; const cy = e.clientY;
        if (isTwo) {
            if (cx < window.innerWidth / 2) masha.hit(cx, cy);
            else dima.hit(cx, cy);
        } else {
            dima.hit(cx, cy);
        }
    });
</script>
</body>
</html>
