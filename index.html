<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Football Duel 2026</title>
    <style>
        :root { --masha: #ff7675; --dima: #74b9ff; --gold: #fdcb6e; }
        body { margin: 0; padding: 0; overflow: hidden; background: #1e272e; font-family: 'Segoe UI', sans-serif; touch-action: none; user-select: none; }
        
        /* Меню */
        #menu {
            position: fixed; inset: 0; background: #1e272e;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000;
        }
        .menu-btn {
            padding: 15px 30px; margin: 10px; font-size: 18px; font-weight: bold;
            border: none; border-radius: 50px; cursor: pointer; width: 280px;
            background: var(--gold); color: black; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        #btn-single { background: var(--dima); color: white; }

        /* Поле ввода баллов */
        .score-input-container { margin-bottom: 25px; text-align: center; color: white; }
        .score-input-container label { display: block; margin-bottom: 10px; font-size: 14px; opacity: 0.8; }
        #targetScore { 
            padding: 12px; border-radius: 12px; font-size: 20px; width: 100px; 
            background: #2d3436; color: var(--gold); border: 2px solid var(--gold); 
            text-align: center; outline: none; font-weight: bold;
        }

        /* Поле игры */
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; visibility: hidden; }
        .zone { position: relative; flex: 1; height: 100%; }
        #zone-masha { background: linear-gradient(180deg, #2d3436, var(--masha)); display: none; border-right: 2px solid rgba(0,0,0,0.3); }
        #zone-dima { background: linear-gradient(180deg, #2d3436, var(--dima)); }

        .ball { 
            position: absolute; width: 75px; height: 75px; background: white;
            background-image: radial-gradient(circle at 50% 50%, #333 22%, transparent 24%), radial-gradient(circle at 0% 0%, #333 22%, transparent 24%);
            background-size: 40px 40px; border-radius: 50%; box-shadow: 0 10px 20px rgba(0,0,0,0.4); z-index: 10; 
        }

        .info { position: absolute; top: 10%; width: 100%; text-align: center; color: white; pointer-events: none; z-index: 20; }
        .score { font-size: 60px; font-weight: 900; margin: 0; }
        .target-info { font-size: 14px; opacity: 0.7; margin-top: 5px; }

        /* Экран победы */
        #win-screen {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; color: white;
        }
        
        #dima-footer { position: absolute; bottom: 15px; width: 100%; text-align: center; color: rgba(255,255,255,0.4); font-size: 11px; }
    </style>
</head>
<body>

<div id="menu">
    <p style="color: #aaa;">онлайн в стадии разработки</p>
    <h1 style="color: white; margin-bottom: 30px; letter-spacing: 3px;">FOOTBALL 2026</h1>
    
    <div class="score-input-container">
        <label>ДО СКОЛЬКИ БАЛЛОВ ИГРАЕМ?</label>
        <input type="number" id="targetScore" value="10" min="1" max="999">
    </div>

    <button class="menu-btn" id="btn-single" onpointerdown="startMode(1)">ИГРАТЬ</button>
    <button class="menu-btn" onpointerdown="startMode(2)">2 ИГРОКА</button>
    <div style="color: #666; font-size: 12px; margin-top: 20px;">Привет Дима, введи любое число выше</div>
</div>

<div id="win-screen">
    <h1 id="winner-name" style="font-size: 35px; color: var(--gold); text-align: center; padding: 20px;"></h1>
    <button class="menu-btn" onpointerdown="location.reload()">ИГРАТЬ СНОВА</button>
</div>

<div id="game-container">
    <div id="zone-masha" class="zone">
        <div class="info">
            <div style="font-size:18px">МАША</div>
            <div id="score-masha" class="score">0</div>
            <div class="target-info">ЦЕЛЬ: <span class="goal-val">10</span></div>
        </div>
        <div id="ball-masha" class="ball"></div>
    </div>
    <div id="zone-dima" class="zone">
        <div class="info">
            <div style="font-size:18px">ДИМА</div>
            <div id="score-dima" class="score">0</div>
            <div class="target-info">ЦЕЛЬ: <span class="goal-val">10</span></div>
        </div>
        <div id="ball-dima" class="ball"></div>
    </div>
</div>

<div id="dima-footer">Привет Дима, игра иногда будет обновляться. Рекорд может сброситься.</div>

<script>
    const config = { grav: 0.45, fric: 0.98, kick: -15 };
    let isTwo = false;
    let target = 10;
    let gameEnded = false;

    class Player {
        constructor(zoneId, ballId, scoreId, name) {
            this.zone = document.getElementById(zoneId);
            this.ball = document.getElementById(ballId);
            this.scoreEl = document.getElementById(scoreId);
            this.name = name;
            this.score = 0; this.x = 0; this.y = 0; this.vx = 0; this.vy = 0; this.rot = 0;
            this.active = false;
        }
        reset(fullReset = false) {
            const r = this.zone.getBoundingClientRect();
            this.x = r.width / 2 - 37;
            this.y = r.height / 3;
            this.vx = 0; this.vy = 0;
            if(fullReset) {
                this.score = 0;
                this.scoreEl.textContent = 0;
            }
        }
        update() {
            if (!this.active || gameEnded) return;
            this.vy += config.grav;
            this.x += this.vx; this.y += this.vy;
            this.vx *= config.fric;
            const r = this.zone.getBoundingClientRect();

            if (this.x < 0) { this.x = 0; this.vx *= -0.8; }
            if (this.x + 75 > r.width) { this.x = r.width - 75; this.vx *= -0.8; }
            if (this.y < 0) { this.y = 0; this.vy *= -0.5; }
            
            if (this.y > r.height) { 
                this.score = 0; 
                this.scoreEl.textContent = 0; 
                this.reset(); 
            }

            this.rot += this.vx * 2;
            this.ball.style.transform = `translate(${this.x}px, ${this.y}px) rotate(${this.rot}deg)`;
        }
        hit(cx, cy) {
            if (gameEnded || !this.active) return;
            const b = this.ball.getBoundingClientRect();
            const bx = b.left + 37; const by = b.top + 37;
            if (Math.hypot(cx - bx, cy - by) < 75) {
                this.applyKick((bx - cx) * 0.7);
            }
        }
        applyKick(fX) {
            this.score++;
            this.scoreEl.textContent = this.score;
            this.vy = config.kick;
            this.vx = fX;
            if (this.score >= target) win(this.name);
        }
    }

    const masha = new Player('zone-masha', 'ball-masha', 'score-masha', 'МАША');
    const dima = new Player('zone-dima', 'ball-dima', 'score-dima', 'ДИМА');

    function startMode(mode) {
        let val = parseInt(document.getElementById('targetScore').value);
        target = (val > 0) ? val : 10;
        
        document.querySelectorAll('.goal-val').forEach(el => el.textContent = target);
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game-container').style.visibility = 'visible';
        
        isTwo = (mode === 2);
        if (isTwo) {
            document.getElementById('zone-masha').style.display = 'block';
            masha.active = true; masha.reset(true);
        }
        dima.active = true; dima.reset(true);
        gameLoop();
    }

    function win(name) {
        gameEnded = true;
        document.getElementById('win-screen').style.display = 'flex';
        document.getElementById('winner-name').textContent = "ПОБЕДА ЗА ИГРОКОМ: " + name;
    }

    function gameLoop() {
        if (masha.active) masha.update();
        if (dima.active) dima.update();
        requestAnimationFrame(gameLoop);
    }

    // Управление мышкой/тачем
    window.addEventListener('pointerdown', (e) => {
        if (masha.active) masha.hit(e.clientX, e.clientY);
        if (dima.active) dima.hit(e.clientX, e.clientY);
    });

    // СЕКРЕТНОЕ УПРАВЛЕНИЕ КЛАВИАТУРОЙ
    window.addEventListener('keydown', (e) => {
        if (gameEnded) return;
        if (e.key === "ArrowUp" && dima.active) {
            dima.applyKick(0);
        }
        if (e.key.toLowerCase() === "w" && masha.active) {
            masha.applyKick(0);
        }
    });
</script>
</body>
</html>
