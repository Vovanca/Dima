<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Football Duel 2026: Dima & Masha</title>
    <style>
        :root { --masha: #ff7675; --dima: #74b9ff; --gold: #fdcb6e; --bomb: #ff4757; }
        * { box-sizing: border-box; touch-action: none; user-select: none; }
        body { margin: 0; padding: 0; overflow: hidden; background: #1e272e; font-family: 'Segoe UI', sans-serif; }
        
        #menu {
            position: fixed; inset: 0; background: #1e272e;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000;
            padding: 20px;
        }
        .menu-btn {
            padding: 14px 28px; margin: 6px; font-size: 16px; font-weight: bold;
            border: none; border-radius: 50px; cursor: pointer; width: 280px;
            background: var(--gold); color: black; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .menu-btn:active { transform: scale(0.95); }
        #btn-single { background: var(--dima); color: white; }
        #btn-bombs { background: var(--bomb); color: white; }

        .score-input-container { margin-bottom: 15px; text-align: center; color: white; }
        #targetScore { 
            padding: 8px; border-radius: 12px; font-size: 18px; width: 100px; 
            background: #2d3436; color: var(--gold); border: 2px solid var(--gold); 
            text-align: center; outline: none; font-weight: bold;
        }

        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; visibility: hidden; }
        .zone { position: relative; flex: 1; height: 100%; overflow: hidden; }
        #zone-masha { background: linear-gradient(180deg, #2d3436, var(--masha)); display: none; border-right: 2px solid rgba(0,0,0,0.3); }
        #zone-dima { background: linear-gradient(180deg, #2d3436, var(--dima)); }

        .ball { 
            position: absolute; width: 75px; height: 75px; background: white;
            background-image: radial-gradient(circle at 50% 50%, #333 22%, transparent 24%), radial-gradient(circle at 0% 0%, #333 22%, transparent 24%);
            background-size: 40px 40px; border-radius: 50%; box-shadow: 0 10px 20px rgba(0,0,0,0.4); z-index: 10; 
            will-change: transform; transition: filter 0.2s;
        }
        .ball.fever { filter: drop-shadow(0 0 15px #ff9f43) drop-shadow(0 0 25px #ee5253); }

        .bomb-item {
            position: absolute; width: 50px; height: 50px; background: #222; border-radius: 50%;
            border: 3px solid var(--bomb); display: flex; align-items: center; justify-content: center;
            font-size: 24px; z-index: 15; box-shadow: 0 0 15px var(--bomb);
            animation: pulse 0.6s infinite alternate;
        }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.15); } }

        .info { position: absolute; top: 6%; width: 100%; text-align: center; color: white; pointer-events: none; z-index: 20; }
        .player-title { font-size: 22px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .score { font-size: 55px; font-weight: 900; margin: 0; line-height: 1; }
        .combo-tag { font-size: 14px; color: var(--gold); font-weight: bold; height: 18px; }

        #win-screen {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92);
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; color: white;
        }
    </style>
</head>
<body>

<div id="menu">
    <h1 style="color: white; margin-bottom: 2px; letter-spacing: 3px;">FOOTBALL 2026</h1>
    <p style="color: var(--gold); font-weight: bold; margin-bottom: 15px;" id="welcome-txt">ДИМА VS МАША</p>
    
    <div class="score-input-container">
        <label for="targetScore" style="display:block; margin-bottom: 5px; font-size: 13px; opacity: 0.8;">ДО СКОЛЬКИ БАЛЛОВ ИГРАЕМ?</label>
        <input type="number" id="targetScore" value="15" min="1" max="999">
    </div>

    <button class="menu-btn" id="btn-single" onclick="startMode(1)">1 ИГРОК</button>
    <button class="menu-btn" onclick="startMode(2)">2 ИГРОКА (ДИМА И МАША)</button>
    <button class="menu-btn" id="btn-bombs" onclick="startMode(2, true)">💣 РЕЖИМ С БОМБАМИ</button>
    <button class="menu-btn" style="background: #2ecc71; color: white;" onclick="window.location.href='level.html'">20 УРОВНЕЙ</button>
    <button class="menu-btn" style="background: #a29bfe; color: white;" onclick="window.location.href='code.html'">СОЗДАТЬ КОД (ОНЛАЙН)</button>
</div>

<div id="win-screen">
    <h1 id="winner-name" style="font-size: 32px; color: var(--gold); text-align: center; padding: 20px;"></h1>
    <button class="menu-btn" onclick="location.reload()">ИГРАТЬ СНОВА</button>
</div>

<div id="game-container">
    <div id="zone-masha" class="zone">
        <div class="info">
            <div id="name-masha" class="player-title" style="color: var(--masha);">МАША</div>
            <div id="score-masha" class="score">0</div>
            <div id="combo-masha" class="combo-tag"></div>
        </div>
        <div id="ball-masha" class="ball"></div>
    </div>
    <div id="zone-dima" class="zone">
        <div class="info">
            <div id="name-dima" class="player-title" style="color: var(--dima);">ДИМА</div>
            <div id="score-dima" class="score">0</div>
            <div id="combo-dima" class="combo-tag"></div>
        </div>
        <div id="ball-dima" class="ball"></div>
    </div>
</div>

<script>
    const config = { grav: 0.45, fric: 0.98, kick: -15 };
    let target = 15;
    let gameEnded = false;
    let bombMode = false;

    const savedName = localStorage.getItem('savedName');

    class Player {
        constructor(zoneId, ballId, scoreId, comboId, nameId, defaultName) {
            this.zone = document.getElementById(zoneId);
            this.ball = document.getElementById(ballId);
            this.scoreEl = document.getElementById(scoreId);
            this.comboEl = document.getElementById(comboId);
            this.nameEl = document.getElementById(nameId);
            this.name = defaultName;
            this.score = 0; this.combo = 0;
            this.x = 0; this.y = 0; this.vx = 0; this.vy = 0; this.rot = 0;
            this.active = false;
            this.bombs = [];

            this.zone.addEventListener('pointerdown', (e) => {
                if (!this.active || gameEnded) return;
                this.checkBombClick(e.clientX, e.clientY);
                this.hit(e.clientX, e.clientY);
            });
        }

        setName(name) {
            this.name = name;
            this.nameEl.textContent = name;
        }

        reset(fullReset = false) {
            const r = this.zone.getBoundingClientRect();
            this.x = r.width / 2 - 37.5;
            this.y = r.height / 3;
            this.vx = 0; this.vy = 0;
            this.combo = 0;
            this.updateComboUI();
            if(fullReset) {
                this.score = 0;
                this.scoreEl.textContent = 0;
            }
        }

        spawnBomb() {
            if (!this.active || !bombMode || gameEnded) return;
            const r = this.zone.getBoundingClientRect();
            const bomb = document.createElement('div');
            bomb.className = 'bomb-item';
            bomb.innerHTML = '💣';
            
            const bx = Math.random() * (r.width - 60);
            const by = r.height * 0.3 + Math.random() * (r.height * 0.4);
            bomb.style.left = bx + 'px';
            bomb.style.top = by + 'px';
            
            this.zone.appendChild(bomb);
            const bombObj = { el: bomb, x: bx + 25, y: by + 25 };
            this.bombs.push(bombObj);

            setTimeout(() => {
                if (bomb.parentNode) bomb.parentNode.removeChild(bomb);
                this.bombs = this.bombs.filter(b => b !== bombObj);
            }, 3000);
        }

        checkBombClick(cx, cy) {
            const r = this.zone.getBoundingClientRect();
            const relX = cx - r.left;
            const relY = cy - r.top;

            this.bombs.forEach((b, idx) => {
                if (Math.hypot(relX - b.x, relY - b.y) < 35) {
                    this.score = Math.max(0, this.score - 3);
                    this.scoreEl.textContent = this.score;
                    this.combo = 0;
                    this.updateComboUI();
                    if (b.el.parentNode) b.el.parentNode.removeChild(b.el);
                    this.bombs.splice(idx, 1);
                    if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
                }
            });
        }

        updateComboUI() {
            if (this.combo >= 5) {
                this.comboEl.textContent = `🔥 FEVER x2 (${this.combo})`;
                this.ball.classList.add('fever');
            } else if (this.combo > 1) {
                this.comboEl.textContent = `КОМБО x${this.combo}`;
                this.ball.classList.remove('fever');
            } else {
                this.comboEl.textContent = '';
                this.ball.classList.remove('fever');
            }
        }

        update() {
            if (!this.active || gameEnded) return;
            this.vy += config.grav;
            this.x += this.vx; this.y += this.vy;
            this.vx *= config.fric;
            const r = this.zone.getBoundingClientRect();

            if (this.x < 0) { this.x = 0; this.vx *= -0.8; }
            if (this.x + 75 > r.width) { this.x = r.width - 75; this.vx *= -0.8; }
            if (this.y < 0) { this.y = 0; this.vy *= -0.5; }
            
            if (this.y > r.height) { 
                this.score = 0; 
                this.scoreEl.textContent = 0; 
                this.reset(); 
            }

            this.rot += this.vx * 2;
            this.ball.style.transform = `translate3d(${this.x}px, ${this.y}px, 0) rotate(${this.rot}deg)`;
        }

        hit(cx, cy) {
            const b = this.ball.getBoundingClientRect();
            const bx = b.left + 37.5; const by = b.top + 37.5;
            
            if (Math.hypot(cx - bx, cy - by) < 80) {
                this.combo++;
                const points = (this.combo >= 5) ? 2 : 1;
                this.score += points;
                this.scoreEl.textContent = this.score;
                
                this.vy = config.kick;
                this.vx = (bx - cx) * 0.7;
                this.updateComboUI();

                if (navigator.vibrate) navigator.vibrate(20);
                if (this.score >= target) win(this.name);
            }
        }
    }

    const masha = new Player('zone-masha', 'ball-masha', 'score-masha', 'combo-masha', 'name-masha', 'МАША');
    const dima = new Player('zone-dima', 'ball-dima', 'score-dima', 'combo-dima', 'name-dima', savedName || 'ДИМА');

    if (savedName) {
        document.getElementById('welcome-txt').textContent = `Привет, ${savedName}! Выбери режим:`;
    }

    function startMode(mode, withBombs = false) {
        let val = parseInt(document.getElementById('targetScore').value);
        target = (val > 0) ? val : 15;
        bombMode = withBombs;
        
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game-container').style.visibility = 'visible';
        
        if (mode === 2) {
            document.getElementById('zone-masha').style.display = 'block';
            masha.active = true; masha.reset(true);
        }
        dima.active = true; dima.reset(true);

        if (bombMode) {
            setInterval(() => {
                if (dima.active) dima.spawnBomb();
                if (masha.active) masha.spawnBomb();
            }, 2500);
        }

        gameLoop();
    }

    function win(name) {
        gameEnded = true;
        document.getElementById('win-screen').style.display = 'flex';
        document.getElementById('winner-name').textContent = "ПОБЕДИЛ(А): " + name + "! 🏆";
    }

    function gameLoop() {
        if (masha.active) masha.update();
        if (dima.active) dima.update();
        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
